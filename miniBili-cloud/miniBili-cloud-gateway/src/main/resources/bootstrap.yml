spring:
  profiles:
    active: dev
  application:
    # 给微服务起名字，也是注册到 Nacos 时的 serviceId。
    name: miniBili-cloud-gateway
  cloud:
    nacos:
      discovery:
        # Nacos-注册中心 的地址
        server-addr: 127.0.0.1:8848
      config:
        #Nacos-配置中心 的地址
        server-addr: 127.0.0.1:8848
        file-extension: yml
        shared-configs:
          - ${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
    gateway:
      routes:
        - id: web
          #lb  loadBalance负载均衡
          uri: lb://miniBili-cloud-web
          predicates:
            - Path=/web/**
          filters:
            # 把请求路径最左边的 1 段（即第一个 / 段）去掉后再转发给下游服务
            - StripPrefix=1

        - id: admin
          #lb  loadBalance负载均衡
          uri: lb://miniBili-cloud-admin
          predicates:
            - Path=/admin/**
          filters:
            # 把请求路径最左边的 1 段（即第一个 / 段）去掉后再转发给下游服务
            - StripPrefix=1
            - AdminFilter

        - id: resource
          #lb  loadBalance负载均衡
          uri: lb://miniBili-cloud-resource
          predicates:
            - Path=/file/**

        - id: interact
          #lb  loadBalance负载均衡
          uri: lb://miniBili-cloud-interact
          predicates:
            - Path=/interact/**
          filters:
            # 把请求路径最左边的 1 段（即第一个 / 段）去掉后再转发给下游服务
            - StripPrefix=1
seata:
  config:
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      group: DEFAULT_GROUP
      data-id: seataServer.properties
      namespace: ""
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: 127.0.0.1:8848
      group : "DEFAULT_GROUP"
      namespace: ""
      username: ""
      password: ""
      context-path: ""
      ##if use MSE Nacos with auth, mutex with username/password attribute
      #access-key: ""
      #secret-key: ""
  tx-service-group: default_tx_group
  service:
    vgroup-mapping:
      default_tx_group: default

